name: redfish-mock

x-bmc: &bmc
  image: redfish-mock:local
  build: .
  environment:
    REDFISH_USERNAME: ${REDFISH_USERNAME:-admin}
    REDFISH_PASSWORD: ${REDFISH_PASSWORD:-admin}
    REDFISH_METRIC_INTERVAL: ${REDFISH_METRIC_INTERVAL:-5}
    REDFISH_SEED: ${REDFISH_SEED:-}
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  init: true

services:
  redfish:
    <<: *bmc
    command: [--multi-profile, --host, 0.0.0.0, --port, '8000']
    ports: ['${REDFISH_BIND_ADDRESS:-127.0.0.1}:${REDFISH_PORT:-8000}:8000']
